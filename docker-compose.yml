services:
  crew:
    build: .
    image: uhta-crew:latest
    # out/ is bind-mounted so run artifacts survive the container: the whole
    # point of the blackboard pattern is that the files outlive the process.
    volumes:
      - ./out:/app/out
    environment:
      # Read from .env (see .env.example). Empty is fine for --selftest and
      # --mock-llm, which make no API calls.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CREW_MODEL: ${CREW_MODEL:-claude-sonnet-4-5}
    # Default is the no-key selftest. Override at the CLI:
    #   docker compose run --rm crew --mock-llm
    #   docker compose run --rm crew --seeds 20
    command: ["--selftest"]

  # Assignment 5. A separate image (Dockerfile.builder) rather than a second
  # command on the crew image: the crew image is part of a tagged submission,
  # its build-time gate is `run_crew.py --selftest`, and it carries no node.
  # This one needs node — builder/generate.py EXECUTES the patched build's
  # acceptance self-test, and without node that check reports SKIPPED instead
  # of passing.
  builder:
    build:
      context: .
      dockerfile: Dockerfile.builder
    image: uhta-builder:latest
    volumes:
      - ./out:/app/out
    environment:
      # docker compose reads .env from the project directory automatically —
      # which is the whole reason to run this way rather than exporting by hand.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CREW_MODEL: ${CREW_MODEL:-claude-sonnet-4-5}
    # Default is the no-key selftest. Override at the CLI:
    #   docker compose run --rm builder --mock-llm
    #   docker compose run --rm builder --run-id a5-live
    command: ["--selftest"]

  # Assignment 6. Its own image (Dockerfile.ger), same reasoning as builder:
  # the tagged submission images stay untouched. No node in this one — the GER
  # patch checks are pure-Python regex over an anchored pattern, not an
  # execution of the build. The image build itself gates on
  # `run_ger.py --selftest` (38 assertions, two of them against the real
  # build file baked into blackboard/) and on `run_content.py --selftest`
  # (ger/ imports content/; prove the direction, don't assert it).
  ger:
    build:
      context: .
      dockerfile: Dockerfile.ger
    image: uhta-ger:latest
    volumes:
      - ./out:/app/out
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CREW_MODEL: ${CREW_MODEL:-claude-sonnet-4-5}
    # Default is the no-key selftest. Override at the CLI:
    #   docker compose run --rm ger --mock-llm --run-id mock-docker-a6
    #   docker compose run --rm ger --run-id a6-live
    command: ["--selftest"]

  # Assignment 6, pipeline #2. Needs node (the patch contract runs
  # `node --check` on every inserted block); image gates on its own selftest
  # plus ger/content non-regression. Two-phase usage — the human gate is the
  # command line:
  #   docker compose run --rm minigame --run-id mg-live                (propose)
  #   docker compose run --rm minigame --build --select <id> --from-run mg-live
  minigame:
    build:
      context: .
      dockerfile: Dockerfile.minigame
    image: uhta-minigame:latest
    volumes:
      - ./out:/app/out
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CREW_MODEL: ${CREW_MODEL:-claude-sonnet-4-5}
    command: ["--selftest"]

  # Assignment 7. Its own image (Dockerfile.style), smallest of the five:
  # style/ imports nothing from crew/, content/, builder/ or ger/, and nothing
  # imports style/. No node. The image build gates on `run_style.py --selftest`
  # (38 assertions). The visual guide is NOT rendered in the container — see
  # the runbook's Phase 3b; it must come from your current local art.
  #   docker compose run --rm style --mock-llm --run-id mock-demo-a7
  #   docker compose run --rm style --mock-llm --run-id mock-trip-a7 --escalation-limit 1
  #   docker compose run --rm style --run-id a7-live
  style:
    build:
      context: .
      dockerfile: Dockerfile.style
    image: uhta-style:latest
    volumes:
      - ./out:/app/out
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CREW_MODEL: ${CREW_MODEL:-claude-sonnet-4-5}
    command: ["--selftest"]

  # A8, the Sonder narrative engine. A server, not a batch run: start it, then
  # open http://127.0.0.1:8765 and play. Ctrl+C stops it. Sessions and the bank
  # are bind-mounted so playthroughs land in the repo for --compile and git.
  sonder:
    build:
      context: .
      dockerfile: Dockerfile.sonder
    image: uhta-sonder:latest
    env_file: .env
    ports:
      - "8765:8765"
    volumes:
      - ./sonder/sessions:/app/sonder/sessions
      - ./sonder/bank:/app/sonder/bank
